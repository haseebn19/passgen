name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.x'

jobs:
  build:
    name: Build and Lint
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --configuration Release

  test:
    name: Test with Coverage
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet restore
      - run: dotnet test --no-restore --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          retention-days: 30

      - name: Coverage Summary
        shell: pwsh
        run: |
          $coverageFile = Get-ChildItem -Path coverage -Filter "coverage.cobertura.xml" -Recurse | Select-Object -First 1
          if (-not $coverageFile) {
            "Coverage file not found" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          $xml = [xml](Get-Content $coverageFile.FullName)
          $lineRate = [math]::Round([double]$xml.coverage.'line-rate' * 100, 2)
          $branchRate = [math]::Round([double]$xml.coverage.'branch-rate' * 100, 2)
          @(
            "## Test Coverage Report"
            ""
            "| Metric | Coverage |"
            "|--------|----------|"
            "| Lines | $lineRate% |"
            "| Branches | $branchRate% |"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
